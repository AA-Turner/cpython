name: Reusable macOS

on:
  workflow_call:
    inputs:
      config_hash:
        required: true
        type: string
      free-threading:
        required: false
        type: boolean
        default: false
      os:
        description: OS to run the job
        required: true
        type: string

env:
  FORCE_COLOR: 1

jobs:
  build-macos:
    name: build and test (${{ inputs.os }})
    runs-on: ${{ inputs.os }}
    timeout-minutes: 60
    env:
      HOMEBREW_NO_ANALYTICS: 1
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
      HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1
      PYTHONSTRICTEXTENSIONBUILD: 1
      TERM: linux
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Runner image version
      run: echo "IMAGE_OS_VERSION=${ImageOS}-${ImageVersion}" >> "$GITHUB_ENV"
    - name: Restore config.cache
      uses: actions/cache@v4
      with:
        path: config.cache
        key: ${{ github.job }}-${{ env.IMAGE_OS_VERSION }}-${{ inputs.config_hash }}
    - name: Install Homebrew dependencies
      run: |
        brew install pkg-config openssl@3.0 xz gdbm tcl-tk@8 make
        # Because alternate versions are not symlinked into place by default:
        brew link --overwrite tcl-tk@8
    - name: Configure CPython
      run: |
        MACOSX_DEPLOYMENT_TARGET=10.15 \
        GDBM_CFLAGS="-I$(brew --prefix gdbm)/include" \
        GDBM_LIBS="-L$(brew --prefix gdbm)/lib -lgdbm" \
        ./configure \
          --config-cache \
          --with-pydebug \
          --enable-slower-safety \
          --enable-safety \
          --prefix=/opt/python-dev \
          --with-openssl="$(brew --prefix openssl@3.0)"
    - name: Display build info
      run: make pythoninfo
    - name: Rebuild pydoc_topics
      run: |
        python -VVV || true
        ${{ env.CPYTHON_BUILDDIR }}/python -VVV || true
        make -C Doc/ venv
        make -C Doc/ pydoc-topics
        diff -u Doc/build/pydoc-topics/topics.py Lib/pydoc_data/topics.py || true
        cp Doc/build/pydoc-topics/topics.py Lib/pydoc_data/topics.py
    - name: Tests
      run: make ci
